
services:
  postgres:
    image: postgres:15
    container_name: postgres_aldila_zahirra_shaffa
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "22001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_aldila_zahirra_shaffa
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: aldila@example.com
      PGADMIN_DEFAULT_PASSWORD: ifunggul
    ports:
      - "44001:80"
    depends_on:
      - postgres


volumes:
  postgres_data:
